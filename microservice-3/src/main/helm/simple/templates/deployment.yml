apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: web
    spec:
      containers:
        - name: monitoring-java
          image: monitoring-java:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          # A. Startup Probe : Tolérante aux lenteurs de KillerCoda
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2       # Teste toutes les 2s
            failureThreshold: 30   # 30 x 2s = 60 secondes max tolérées !

          # B. Readiness Probe : S'active dès le succès de la Startup Probe
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0 # Pas de délai une fois Spring démarré
            periodSeconds: 2

          # C. Liveness Probe
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5